# A design system release reaches this plugin on its own, without a release of the plugin.
#
# rms-ds-figma-plugins sends a `ds-release` dispatch with the new version when it tags one; a daily check finds a
# newer design system version on its own (or run this by hand). This job pins that version, installs, tests and
# builds, then:
#   • tests fail       → a pull request with the failing bump, nothing committed to main;
#   • otherwise        → it commits the pin and the rebuilt plugin to main ("build: ds-core vX.Y.Z"). The plugin
#                        version stays as it is: no tag, no changelog entry, no draft release.
# The update ships with the next version you publish: run `pnpm release` (rms-release) when you publish in Figma
# Community, and the release workflow drafts that version with its sideload zip.
name: ds-update

on:
  repository_dispatch:
    types: [ds-release]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Design system version to update to, e.g. v1.0.1 (empty: the latest)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ds-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DS_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # No pnpm cache: on a day with no new system version nothing is installed, and saving a cache that was never
          # filled fails the run although it did its job.
      - name: Find the version
        run: |
          PINNED="$(node -p 'require("./package.json").dependencies["@rms/ds-core"].split("#")[1]')"
          if [ -z "$DS_VERSION" ]; then
            DS_VERSION="$(git ls-remote --tags --refs https://github.com/rafaelmatosdasilva/rms-ds-figma-plugins 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          fi
          if [ "$DS_VERSION" = "$PINNED" ] || [ -z "$DS_VERSION" ] || [ "$(printf '%s\n%s\n' "$PINNED" "$DS_VERSION" | sort -V | tail -1)" = "$PINNED" ]; then
            echo "Pinned to $PINNED, the latest: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          echo "DS_VERSION=$DS_VERSION" >> "$GITHUB_ENV"
      - name: Check the version
        if: env.SKIP != '1'
        run: |
          echo "$DS_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Not a design system version: $DS_VERSION"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pin the new design system version
        if: env.SKIP != '1'
        run: |
          node -e '
            const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.dependencies["@rms/ds-core"] = p.dependencies["@rms/ds-core"].replace(/#.*$/, "#" + process.env.DS_VERSION);
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
          pnpm install --no-frozen-lockfile
      - name: Test
        if: env.SKIP != '1'
        id: test
        continue-on-error: true
        run: pnpm test
      - name: Tests failed, open a pull request instead
        if: env.SKIP != '1' && steps.test.outcome == 'failure'
        run: |
          BRANCH="ds-core-$DS_VERSION"
          git checkout -b "$BRANCH"
          git commit -am "build: ds-core $DS_VERSION (tests fail)"
          git push -f origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "build: ds-core $DS_VERSION (tests fail)" \
            --body "The design system $DS_VERSION breaks this plugin's tests, so nothing was released. See the ds-update run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          exit 1
      - name: Build
        if: env.SKIP != '1'
        run: pnpm build
      - name: Commit the update, no release
        if: env.SKIP != '1'
        run: |
          if git diff --quiet -- code.js ui.html; then
            MSG="build: ds-core $DS_VERSION (no change to the plugin)"
            NOTE="Nothing the plugin ships changed: pin updated."
          else
            MSG="build: ds-core $DS_VERSION"
            NOTE="Rebuilt with design system $DS_VERSION and committed. The plugin version is unchanged and no release was drafted; it ships with the next version you publish (pnpm release)."
          fi
          git commit -am "$MSG"
          git push origin main
          echo "$NOTE" >> "$GITHUB_STEP_SUMMARY"
